# Exposes the committed Python binding (generated/python/vr_link_generated.py)
# and the hand-written package (src/vr_link) as importables.
#
# Consumers install editable from their submodule checkout
# (pip install -e <path-to-this-repo>[video] / uv path source) and must re-run
# that install after pulling a pin that changes this file (with two package
# roots the editable install uses a package finder instead of a .pth path
# entry). The authoritative schema version is the git commit (submodule pin),
# not the nominal version below.
#
# Optional extras keep `import vr_link` dependency-light (flatbuffers + numpy):
#   video        H.264 encoding + the stream pump (PyAV)
#   yaml         YAML calibration files / stream configs
#   calibration  checkerboard capture + stereo calibration tools (OpenCV)
#   dds          marker only: the DDS camera source and robot-state subscribers
#                need the igris_c_sdk Python binding (py3.12 wheel, not
#                pip-installable). Since 2.1 vr_link vendors no SDK: the host
#                repository that runs the stream (igris_c_gmr) builds the wheel
#                from its own igris_c_sdk pin and installs it into the shared
#                env, or IGRIS_C_SDK_ROOT points at a checkout.
#   dev          pytest
#
# The stream sender (`vr-link-stream`) is a console script launched by the host
# repository (igris_c_gmr launcher); this repo's own pixi env covers the tests,
# code generation and the calibration tools only.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vr-link"
version = "2.0.0"
description = "VR headset link: VRS1 pose uplink, VRL2 downlink (video, calibration, robot state), H.264 encoding, frame/state sources and stereo calibration"
# The receiver package evaluates tuple[...] type aliases at import time (3.9+).
requires-python = ">=3.9"
# Runtime must stay compatible with the flatc that generated the binding
# (see FLATC_VERSION in scripts/generate.sh).
dependencies = ["flatbuffers>=24,<26", "numpy>=1.24"]

[project.optional-dependencies]
video = ["av>=13,<18"]
yaml = ["pyyaml>=6"]
calibration = ["opencv-python-headless>=4.8", "pyyaml>=6"]
dds = []
dev = ["pytest>=8"]

[project.scripts]
vr-link-stream = "vr_link.cli.stream:main"
vr-link-make-calibration = "vr_link.cli.make_calibration:main"
vr-link-calibration-fov = "vr_link.cli.calibration_fov:main"
vr-link-capture-checkerboard = "vr_link.tools.capture_checkerboard:main"
vr-link-capture-checkerboard-headless = "vr_link.tools.capture_checkerboard_headless:main"
vr-link-focus-check = "vr_link.tools.focus_check:main"
vr-link-calibrate-cams = "vr_link.tools.calibrate_cams:main"

[tool.setuptools]
# Two import roots: flatc output stays a flat module under generated/python;
# the hand-written package lives under src/vr_link.
package-dir = {"" = "generated/python", "vr_link" = "src/vr_link"}
py-modules = ["vr_link_generated"]
packages = [
    "vr_link",
    "vr_link.calibration",
    "vr_link.cli",
    "vr_link.configs",
    "vr_link.messages",
    "vr_link.network",
    "vr_link.network.dds",
    "vr_link.pipeline",
    "vr_link.sources",
    "vr_link.tools",
    "vr_link.utils",
    "vr_link.video",
]

[tool.setuptools.package-data]
# Only the configs ship; measured calibrations and captures are machine-local
# (data/, git-ignored) and never enter the wheel.
"vr_link.configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- pixi -------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
flatbuffers = ">=24,<26"
numpy = ">=2.0,<3"

[tool.pixi.pypi-dependencies]
vr-link = { path = ".", editable = true }

# conda-forge ffmpeg (gpl build) behind PyAV carries libx264, h264_nvenc,
# h264_vaapi and h264_qsv; hardware encoders still need the host driver. A host
# repository that launches `vr-link-stream` (igris_c_gmr) mirrors these three
# feature dependency sets in its own pixi manifest.
[tool.pixi.feature.video.dependencies]
av = ">=17.0.1,<18"

[tool.pixi.feature.calibration.dependencies]
opencv = ">=4.10,<5"
pyyaml = ">=6.0,<7"

[tool.pixi.feature.test.dependencies]
pytest = ">=8"

# No stream tasks here (2.1): the usb/dds senders need the igris_c_sdk binding this
# repo no longer carries, and every target (robot, MuJoCo, Isaac, shm) is started by
# the host repository's launcher (igris_c_gmr), which selects the packaged
# stream_*.yaml per target.
[tool.pixi.feature.video.tasks]
make-mujoco-calibration = "vr-link-make-calibration"

[tool.pixi.feature.calibration.tasks]
capture-checkerboard = "vr-link-capture-checkerboard"
# No window: for the robot NUC over SSH (a forwarded imshow lags and blurs the shots).
capture-checkerboard-headless = "vr-link-capture-checkerboard-headless"
# Live per-eye Laplacian sharpness in the terminal: lens focus adjustment over SSH.
focus-check = "vr-link-focus-check"
calibrate-cams = "vr-link-calibrate-cams"
calibration-fov = "vr-link-calibration-fov"

[tool.pixi.feature.test.tasks]
# A ROS 2 install on the shell PYTHONPATH autoloads its launch_testing pytest
# plugin, which fails to import; disable plugin autoload.
test = { cmd = "python -m pytest tests -q", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }

[tool.pixi.tasks]
generate = "scripts/generate.sh"

[tool.pixi.environments]
default = { features = ["video", "calibration", "test"], solve-group = "default" }
