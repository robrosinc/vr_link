# VRL2 downlink fed by the robot's eyes_stereo DDS topic (JPEG) + the robot's DDS state.
#   vr-link-stream --source dds [--config this-file] [--dds-namespace igris_c_XXXX] [--dds-domain N]
# Needs the igris_c_sdk Python binding from the host repository's env (igris_c_gmr
# `pixi run install-sdk`, or IGRIS_C_SDK_ROOT); vr_link itself ships no SDK.
# Matches igris_c_camera (direct mode, camera on the NUC, igris_c_camera >= 2026-09-10):
# CompressedImage_ on <ns>/sensor/eyes_stereo/compressed, frame_id "stereo_image",
# header.stamp = acquisition time. dds.domain_id, namespace and topic_naming must equal
# the robot's robot.yaml igris_c.network.* values (the camera reads the same keys).

eyes_stereo:
  resolution: [1280, 480]   # frames are resized to this SBS size before encoding; must match the served calibration's mode
  fps: 30
  enable_stereo: true

tcp:
  host: "0.0.0.0"
  port: 9100
  bitrate: 8000000
  gop: 30
  encoder: "sw"

# Second video stream (VideoFrame.stream_id = HeadRgb) from the head colour camera: the
# igris_c_camera d435 worker and the hit-tasks Isaac bridge publish CompressedImage_ on
# <ns>/sensor/d435_color/compressed (frame_id "d435_color", 640x480, 15 fps). Needs a headset
# build that demultiplexes stream_id; an older build would feed these frames to its stereo
# decoder, so it stays off until that build is deployed. Encoded with tcp.encoder.
head_rgb:
  enable: false
  camera_topic: "sensor/d435_color/compressed"   # bare name; the channel prefixes the namespace
  frame_id: ""              # drop samples whose header.frame_id differs (empty = accept all)
  resolution: [640, 480]    # frames are resized to this before encoding
  fps: 15
  bitrate: 2000000
  gop: 15

calibration:
  enable: true
  host: "0.0.0.0"
  port: 9101
  provider: yaml
  yaml: "data:calibration/igris_c_eyes_stereo_unreal.yaml"   # vr-link-calibrate-cams ... --serve-as igris_c_eyes_stereo_unreal.yaml

dds:
  domain_id: 0              # robot.yaml igris_c.network.cyclonedds.domain_id (or --dds-domain)
  namespace: ""             # REQUIRED: the robot's namespace, igris_c_<suffix> (or --dds-namespace)
  topic_naming: native      # robot.yaml igris_c.network.dds_topic_naming
  config_uri: ""            # CycloneDDS XML path/URI; empty honours $CYCLONEDDS_URI / defaults
  camera_topic: "sensor/eyes_stereo/compressed"   # bare name; the channel prefixes the namespace
  frame_id: ""              # drop samples whose header.frame_id differs (empty = accept all; the camera sends "stereo_image")
  topics: {lowstate: lowstate, handstate: handstate, handcmd: handcmd, refstate: gmr/refstate}
  buffer_capacity: 512

robot_state:
  actual: dds
  reference: dds
  hand_actual: dds
  hand_command: dds
  base_pose: none
  tolerances_ms: {actual: 5, reference: 15, hand_actual: 40, hand_command: 40}

signals:
  source: robot
  recording: none
  motion_feedback: dds            # igris_c_teleop teleop/motion_feedback -> Signals.converging / arm_hold_* (idle when silent for 1 s)
