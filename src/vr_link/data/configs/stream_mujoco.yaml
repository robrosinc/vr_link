# Stereo H.264 VSTR stream fed by the igris_c_mujoco vision shared-memory segment.
#   vr-link-stream --source mujoco [--config this-file]
# The frame geometry is fixed by the producer (vision_shm.h: 1280x480 SBS = 640x480
# per eye, 30 Hz, right eye in the left half). The encoder follows the producer size.

eyes_stereo:
  resolution: [1280, 480]   # informational; the segment header is authoritative
  fps: 30
  enable_stereo: true

tcp:
  host: "0.0.0.0"
  port: 9100
  bitrate: 8000000
  gop: 30
  encoder: "sw"

calibration:
  enable: true
  host: "0.0.0.0"
  port: 9101
  # ideal_from_source: computed on request from the per-eye camera model the
  # producer publishes in the segment header (layout v2). A v1 producer has no
  # metadata; then the `ideal` rig below is used (ideal_from_config).
  provider: ideal_from_source
  ideal:
    fovy_deg: 90.0          # igris_c_v2_vision.xml.xacro
    toe_out_deg: 14.0
    baseline_mm: 52.152     # 2 * 0.026076 m

mujoco:
  shm_name: "/igris_c_mujoco_vision_shm"
  read_timeout_sec: 1.0     # wait for a new frame before re-checking the segment
