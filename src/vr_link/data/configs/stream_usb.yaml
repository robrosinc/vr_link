# Stereo H.264 VSTR stream from the NUC's USB eyes_stereo camera.
#   vr-link-stream --source usb [--config this-file]
# Same schema for every source; only the `eyes_stereo`/`tcp` capture keys and the
# calibration provider differ. Relative paths resolve against this file's
# directory; "data:" addresses vr_link's packaged data.

eyes_stereo:
  cam_index: "/dev/eyes_stereo"
  # Side-by-side, right eye in the left half. 1280x480 = 640x480 per eye (4:3),
  # the mode shared with the simulators. The served calibration must be
  # measured in this same mode (vr-link-capture-checkerboard defaults to it);
  # the packaged igris_c_eyes_stereo_unreal.yaml is still the 1280x720 (16:9)
  # measurement and must be replaced by a 1280x480 one.
  resolution: [1280, 480]
  fps: 30
  enable_stereo: true
  apply_tuning: true        # camera_image_stream.cpp tone settings via V4L2

tcp:
  host: "0.0.0.0"
  port: 9100
  bitrate: 8000000
  gop: 30
  fourcc: "MJPG"
  encoder: "sw"             # sw | libx264 | h264_nvenc | h264_vaapi | h264_qsv

calibration:
  enable: true
  host: "0.0.0.0"
  port: 9101
  provider: yaml            # the real camera serves its measured calibration
  yaml: "data:calibration/igris_c_eyes_stereo_unreal.yaml"
