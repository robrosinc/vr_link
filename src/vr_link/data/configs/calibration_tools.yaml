# Checkerboard capture and stereo calibration of the eyes_stereo camera.
#   vr-link-capture-checkerboard [--config this-file] [--source usb|dds] --output-dir captures
#   vr-link-calibrate-cams       [--config this-file] --input-dir captures/<ts> --output-dir out

camera:
  index: "/dev/eyes_stereo"
  api: cv2.CAP_V4L2
  # Capture in the mode that will be streamed: each mode is a different sensor
  # crop, so its calibration (and field of view) is only valid for that mode.
  # 1280x480 SBS = 640x480 per eye (4:3), the target mode shared with the
  # simulators; the packaged igris_c_eyes_stereo_unreal.yaml was measured in
  # the 1280x720 (16:9) mode and does not apply to 4:3.
  width: 1280
  height: 480
  fps: 30
  left_half: right          # the LEFT half of the SBS frame holds the RIGHT eye

checkerboard:
  board_cols: 9
  board_rows: 6
  square_size: 28.0
  square_unit: mm

capture:
  target_count: 15
  mode: manual              # manual | auto | both
  auto_start: true
  auto_interval_sec: 1.0
  require_both_detected: true
  image_format: png
  show_saved_feedback: true
  saved_feedback_sec: 0.5
  window_name: Stereo Checkerboard Capture

calibration:
  camera_model: fisheye     # fisheye | pinhole
  image_pattern: "*_sbs.png"
  output_yaml: stereo_calibration.yaml          # OpenCV FileStorage (full result)
  output_unreal_yaml: stereo_calibration_unreal.yaml   # flat keys served on port 9101
  output_maps: calibration_maps.npz
  debug_dir: debug
  alpha: 1.0
  fisheye_balance: 0.0
  fisheye_fov_scale: 1.0
  fisheye_check_cond: false
  min_valid_pairs: 10

# vr-link-capture-checkerboard --source dds only (igris_c_sdk required).
dds:
  domain_id: 1
  namespace: ""
  topic: "igris_c/sensor/eyes_stereo"
  config_uri: ""
