# Stereo H.264 VSTR stream fed by the robot's eyes_stereo DDS topic (JPEG).
#   vr-link-stream --source dds [--config this-file]
# Needs the igris_c_sdk Python binding in the environment (or IGRIS_C_SDK_ROOT).
# NOTE (verification owner: operator): the `dds` defaults come from the former
# LAN-relay setup and must be confirmed against the actual deployment topology.

eyes_stereo:
  resolution: [1280, 480]   # frames are resized to this SBS size before encoding; must match the served calibration's mode
  fps: 30
  enable_stereo: true

tcp:
  host: "0.0.0.0"
  port: 9100
  bitrate: 8000000
  gop: 30
  encoder: "sw"

calibration:
  enable: true
  host: "0.0.0.0"
  port: 9101
  provider: yaml
  yaml: "data:calibration/igris_c_eyes_stereo_unreal.yaml"

dds:
  domain_id: 1
  namespace: ""
  topic: "igris_c/sensor/eyes_stereo"
  config_uri: ""            # CycloneDDS XML path/URI; empty honours $CYCLONEDDS_URI / defaults
  frame_id: ""              # drop samples whose header.frame_id differs (empty = accept all)
